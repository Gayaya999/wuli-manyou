<!doctype html>
<html lang="zh-CN" data-scientist-agent-api="/api">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="物理漫游用户档案：署名、软盘与通信痕迹。"
    />
    <title>我的档案 · 物理漫游</title>
    <script>
      (() => {
        const saved = localStorage.getItem("qo-alt-theme");
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=no-sky-1" />
    <link rel="stylesheet" href="./me.css?v=no-sky-1" />
  </head>
  <body class="cabinet-page">
    <a class="skip" href="#visitorName">跳到署名</a>

    <main>
      <div class="shell">
        <header class="masthead">
          <a class="wordmark" href="./" aria-label="物理漫游首页">物理漫游</a>
          <nav class="site-nav" aria-label="展厅">
            <a href="./">门厅</a>
            <a href="./#stage">实验</a>
            <a href="./visitors.html">来访者</a>
            <a href="./me.html" aria-current="page">我的</a>
          </nav>
          <div class="appearance" role="group" aria-label="外观">
            <button type="button" data-theme="light" aria-pressed="false">浅色</button>
            <button type="button" data-theme="dark" aria-pressed="true">深色</button>
          </div>
        </header>

        <section class="room identity" aria-labelledby="roomTitle">
          <div class="identity-row">
            <figure class="portrait" aria-label="像素形象">
              <img id="pixelPortrait" alt="你的像素形象" hidden />
              <p class="portrait-empty" id="portraitEmpty">还没有像素形象</p>
            </figure>
            <div class="identity-copy">
              <p class="room-kicker" id="identityLatin">Visitor</p>
              <h1 id="roomTitle" class="identity-name">尚未署名</h1>
              <p class="lede identity-lede">
                这是你的展厅角落。署名之后，软盘、对话和像素形象会写入你的档案。
              </p>
              <p class="ledger" id="ledger">软盘 0 张 · 通信 0 人</p>
            </div>
          </div>
          <form class="sign" id="signForm">
            <label>
              中文名
              <input id="visitorName" type="text" maxlength="16" autocomplete="off" placeholder="林晓秋" />
            </label>
            <label>
              拉丁名
              <input id="visitorLatin" type="text" maxlength="24" autocomplete="off" placeholder="X. LIN" />
            </label>
            <button type="submit">写入档案</button>
          </form>
          <form class="portrait-make" id="portraitForm">
            <label class="portrait-drop" id="portraitDrop">
              <input id="portraitFile" type="file" accept="image/*" class="sr-only" />
              <span id="portraitHint">放进一张照片</span>
            </label>
            <button type="submit" id="makePortrait">生成形象</button>
            <button type="button" id="clearPortrait" hidden>取回形象</button>
          </form>
          <p class="sign-status" id="signStatus" aria-live="polite"></p>
        </section>

        <section class="atlas" aria-labelledby="atlasTitle">
          <div class="section-head">
            <h2 id="atlasTitle">九人图鉴</h2>
            <p class="atlas-count" id="atlasCount">走过 0 / 9</p>
          </div>
          <p class="section-note">聊过的人会亮起来。空位等你去门厅开口。</p>
          <ul class="atlas-grid" id="atlasGrid"></ul>
        </section>

        <section class="mine-disks" aria-labelledby="disksTitle">
          <div class="section-head">
            <h2 id="disksTitle">我的软盘</h2>
            <a class="text-link" href="./visitors.html">去制盘</a>
          </div>
          <p class="section-note" id="disksNote">来访者柜里还没有你的盘。制成后会回到这里。</p>
          <div class="cabinet mine-cabinet" id="mineCabinet"></div>
        </section>

        <section class="mine-talks" aria-labelledby="talksTitle">
          <div class="section-head">
            <h2 id="talksTitle">通信痕迹</h2>
            <a class="text-link" href="./?talk=1#stage">去对话</a>
          </div>
          <p class="section-note" id="talksNote">还没有和科学家说过话。门厅右侧可以开始第一句。</p>
          <ul class="talk-list" id="talkList"></ul>
        </section>
      </div>
    </main>

    <footer class="colophon">
      <a href="./">回到门厅</a>
      <a href="./">门厅</a>
      <span>挑战杯原型</span>
    </footer>

    <script src="./me.js?v=atlas-1" type="module"></script>
  </body>
</html>
