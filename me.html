<!doctype html>
<html lang="zh-CN" data-scientist-agent-api="/api">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="物理漫游用户档案：署名、图鉴与通信痕迹。"
    />
    <title>我的档案 · 物理漫游</title>
    <script>
      (() => {
        const saved = localStorage.getItem("qo-alt-theme");
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=sky-fade-4k-1" />
    <link rel="stylesheet" href="./me.css?v=no-sky-1" />
    <link rel="stylesheet" href="./visual-system.css?v=nav-slide-1" />
    <link rel="stylesheet" href="./exhibition.css?v=hierarchy-2" />
  </head>
  <body class="cabinet-page">
    <a class="skip" href="#visitorName">跳到署名</a>

    <main>
      <div class="shell">
        <header class="masthead">
          <a class="wordmark" href="./" aria-label="物理漫游首页">物理漫游</a>
          <nav class="site-nav" aria-label="展厅">
            <a href="./">门厅</a>
            <a href="./?figure=newton#experiment-newton-gravity">实验</a>
            <a href="./community.html">社区</a>
            <a href="./me.html" aria-current="page">我的</a>
          </nav>
          <div class="appearance" role="group" aria-label="外观">
            <button type="button" data-theme="light" aria-pressed="false">浅色</button>
            <button type="button" data-theme="dark" aria-pressed="true">深色</button>
          </div>
        </header>

        <div class="demo-banner" id="demoBanner" role="status" hidden>
          <p><strong>正在查看演示档案</strong><span>这是一位示例用户的样子，你自己的档案不受影响。</span></p>
          <button type="button" id="demoExit">退出演示</button>
        </div>

        <section class="room identity" aria-labelledby="roomTitle">
          <div class="identity-row">
            <figure class="portrait" aria-label="像素形象">
              <img id="pixelPortrait" alt="你的像素形象" hidden />
              <p class="portrait-empty" id="portraitEmpty">还没有像素形象</p>
            </figure>
            <div class="identity-copy">
              <p class="room-kicker" id="identityLatin">Visitor</p>
              <h1 id="roomTitle" class="identity-name">尚未署名</h1>
              <p class="lede identity-lede">
                你的形象与探索足迹。
              </p>
              <p class="ledger" id="ledger">通信 0 人</p>
              <button class="demo-open" id="demoOpen" type="button">看看演示档案</button>
            </div>
          </div>
          <form class="sign" id="signForm">
            <label>
              中文名
              <input id="visitorName" type="text" maxlength="16" autocomplete="off" placeholder="林晓秋" />
            </label>
            <label>
              拉丁名
              <input id="visitorLatin" type="text" maxlength="24" autocomplete="off" placeholder="X. LIN" />
            </label>
            <button type="submit">写入档案</button>
          </form>
          <form class="portrait-make" id="portraitForm">
            <label class="portrait-drop" id="portraitDrop">
              <input id="portraitFile" type="file" accept="image/*" class="sr-only" />
              <span id="portraitHint">放进一张照片</span>
            </label>
            <button type="submit" id="makePortrait">生成形象</button>
            <button type="button" id="clearPortrait" hidden>取回形象</button>
          </form>
          <p class="sign-status" id="signStatus" aria-live="polite"></p>
        </section>

        <section class="atlas" aria-labelledby="atlasTitle">
          <div class="section-head">
            <h2 id="atlasTitle">成就卡</h2>
            <div class="atlas-meta">
              <p class="atlas-count" id="atlasCount">已解锁 0 / 9</p>
              <button class="atlas-toggle" id="atlasToggle" type="button" aria-expanded="false" aria-controls="atlasBody">
                <span>展开</span>
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
              </button>
            </div>
          </div>
          <p class="section-note">和一位科学家聊上一次，就点亮他的成就卡；聊满 6 句，卡片升为金边。</p>
          <div class="ach-summary" aria-label="成就进度">
            <div class="ach-bar" role="progressbar" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0" id="achBar"><i id="achBarFill"></i></div>
            <ol class="ach-milestones" id="achMilestones"></ol>
          </div>
          <div class="atlas-body" id="atlasBody" data-open="false">
            <div class="atlas-body-inner">
              <ul class="ach-grid" id="atlasGrid"></ul>
            </div>
          </div>
        </section>

        <section class="mine-disks" hidden aria-labelledby="disksTitle">
          <div class="section-head">
            <h2 id="disksTitle">我的软盘</h2>
            <a class="text-link" href="./community.html">去社区</a>
          </div>
          <p class="section-note" id="disksNote">还没有软盘。</p>
          <div class="cabinet mine-cabinet" id="mineCabinet"></div>
        </section>

        <section class="mine-talks" aria-labelledby="talksTitle">
          <div class="section-head">
            <h2 id="talksTitle">通信痕迹</h2>
            <a class="text-link" href="./?talk=1#stage">去对话</a>
          </div>
          <p class="section-note" id="talksNote">还没有对话。</p>
          <ul class="talk-list" id="talkList"></ul>
        </section>
      </div>
    </main>

    <footer class="colophon">
      <a href="./">门厅</a>
      <span>挑战杯原型</span>
    </footer>

    <script src="./me.js?v=showcase-1" type="module"></script>
    <script src="./nav-motion.js?v=experiment-2" type="module"></script>
  </body>
</html>
