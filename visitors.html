<!doctype html>
<html lang="zh-CN" data-scientist-agent-api="/api">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="物理漫游来访者档案：把一张软盘留在柜里。"
    />
    <title>来访者档案 · 物理漫游</title>
    <script>
      (() => {
        const saved = localStorage.getItem("qo-alt-theme");
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=play-talk-1" />
    <link rel="stylesheet" href="./visitors.css?v=play-talk-1" />
  </head>
  <body class="cabinet-page">
    <a class="skip" href="#openBench">跳到制盘</a>

    <main>
      <div class="shell">
        <header class="masthead">
          <a class="wordmark" href="./" aria-label="物理漫游首页">物理漫游</a>
          <nav class="site-nav" aria-label="展厅">
            <a href="./">门厅</a>
            <a href="./#stage">实验</a>
            <a href="./visitors.html" aria-current="page">来访者</a>
            <a href="./me.html">我的</a>
          </nav>
          <div class="appearance" role="group" aria-label="外观">
            <button type="button" data-theme="light" aria-pressed="false">浅色</button>
            <button type="button" data-theme="dark" aria-pressed="true">深色</button>
          </div>
        </header>

        <section class="room" aria-labelledby="roomTitle">
          <h1 id="roomTitle">来访者档案</h1>
          <p class="lede">九位物理学家的档案软盘。你也可以留下一张。</p>
          <button class="text-link" id="openBench" type="button">存放一张档案</button>
          <div class="cabinet" id="cabinet" aria-label="物理学家档案软盘"></div>
        </section>

        <section class="bench" id="bench" hidden>
          <div class="bench-head">
            <h2>工作台</h2>
            <button class="ask-close" id="closeBench" type="button">收起</button>
          </div>
          <div class="bench-grid">
            <label class="drop" id="drop">
              <input id="portrait" type="file" accept="image/*" class="sr-only" />
              <span id="dropHint">放进一张肖像</span>
              <img id="dropPreview" alt="" hidden />
            </label>
            <div class="bench-fields">
              <label>
                中文名
                <input id="diskName" type="text" maxlength="16" autocomplete="off" placeholder="林晓秋" />
              </label>
              <label>
                拉丁名
                <input id="diskLatin" type="text" maxlength="24" autocomplete="off" placeholder="可空" />
              </label>
              <label>
                年份
                <input id="diskYears" type="text" maxlength="18" autocomplete="off" placeholder="2026" />
              </label>
              <label>
                关键词
                <input id="diskKeywords" type="text" maxlength="24" autocomplete="off" placeholder="观察 · 提问 · 停留" />
              </label>
              <fieldset class="shells">
                <legend>盘壳</legend>
                <div class="shell-swatches" id="shells"></div>
              </fieldset>
            </div>
          </div>
          <div class="bench-result">
            <img id="mintPreview" alt="刚制成的档案软盘" hidden />
            <div class="bench-actions">
              <button type="button" class="mint" id="mint">制盘</button>
              <button type="button" class="hang" id="hang" disabled>放入展墙</button>
            </div>
          </div>
          <p class="cta-status" id="benchStatus" aria-live="polite"></p>
        </section>

        <section class="board" id="community" aria-labelledby="communityTitle">
          <header class="board-head">
            <h2 id="communityTitle">社区动态</h2>
            <button class="text-link" id="openUpload" type="button">上传软盘</button>
          </header>
          <p class="board-lede">来访者把盘留在墙上。点开一张就能看清标签。</p>
          <div class="board-wall" id="communityWall" aria-label="社区软盘墙"></div>
        </section>

        <section class="works" id="works" aria-labelledby="worksTitle">
          <p class="essay-kicker">来访者作品</p>
          <h2 id="worksTitle">社区里留下的游戏</h2>
          <p class="works-lede">试玩和下载都在这面墙上，不另开一站。</p>
          <div class="works-list" id="worksList" data-works-feed="./data/community-feed.json"></div>
        </section>
      </div>
    </main>

    <footer class="colophon">
      <a href="./">门厅</a>
      <span>挑战杯原型</span>
    </footer>

    <dialog class="lightbox" id="lightbox" aria-label="放大档案软盘">
      <img id="lightboxImage" alt="" />
      <div class="lightbox-actions">
        <button class="lightbox-close" id="retrieve" type="button" hidden>取回</button>
        <form method="dialog"><button class="lightbox-close" type="submit">关闭</button></form>
      </div>
    </dialog>

    <dialog class="board-room" id="uploadRoom" aria-labelledby="uploadTitle">
      <form class="board-frame" id="uploadForm">
        <header class="talk-head">
          <h2 id="uploadTitle">上传软盘</h2>
          <button class="talk-leave" id="uploadLeave" type="button">离开</button>
        </header>
        <label class="board-drop">
          <input id="uploadPortrait" type="file" accept="image/*" class="sr-only" />
          <span id="uploadHint">肖像可空，空则用生成的像素脸</span>
          <img id="uploadPreview" alt="" hidden />
        </label>
        <label>
          名字
          <input id="uploadName" type="text" maxlength="16" autocomplete="off" placeholder="林晓秋" />
        </label>
        <label>
          一句观察
          <input id="uploadNote" type="text" maxlength="36" autocomplete="off" placeholder="苹果落下的时候，我也在场。" />
        </label>
        <fieldset class="shells">
          <legend>盘壳</legend>
          <div class="shell-swatches" id="uploadShells"></div>
        </fieldset>
        <button class="board-submit" type="submit">放入展墙</button>
        <p class="cta-status" id="uploadStatus" aria-live="polite"></p>
      </form>
    </dialog>

    <script src="./visitors.js?v=play-talk-1" type="module"></script>
    <script src="./community.js?v=play-talk-1" type="module"></script>
    <script src="./works.js?v=play-talk-1" type="module"></script>
  </body>
</html>
